{% set name = "pytoolconfig" %}
{% set version = "1.3.1" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/bagel897/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 07eaa7e66f25c9fda089c4f4ac306faea0794f65df9cabd9d4755a6b9e0ed8e3

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  script_env:
    - PDM_BUILD_SCM_VERSION={{ version }}
  skip: true # [py<38]

requirements:
  host:
    - pip
    - python
    - pdm-backend >=1.0.5
  run:
    - python
    - tomli >=2.0.1  # [py<311]
    - packaging >=23.2
  run_constrained:
    # validation
    - pydantic >=2.5.3
    # global
    - platformdirs >=3.11.0

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - pytoolconfig
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest >=7.4.4
    - pydantic >=2.5.3
    - platformdirs >=3.11.0
    - sphinx >=7.1.2
    - tabulate >=0.9.0

about:
  home: https://github.com/bagel897/pytoolconfig
  dev_url: https://github.com/bagel897/pytoolconfig
  summary: Python tool configuration
  description: |
    Python tool configuration.
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_url: https://github.com/bagel897/pytoolconfig/blob/main/LICENSE
  doc_url: https://github.com/bagel897/pytoolconfig/blob/main/README.md

extra:
  recipe-maintainers:
    - jan-janssen