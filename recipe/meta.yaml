{% set version = "1.3.1" %}

package:
  name: pytoolconfig
  version: {{ version }}

source:
  url: https://github.com/bagel897/pytoolconfig/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 07eaa7e66f25c9fda089c4f4ac306faea0794f65df9cabd9d4755a6b9e0ed8e3

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<38]
  number: 0
  script_env:
    - PDM_BUILD_SCM_VERSION={{ version }}

requirements:
  host:
    - python
    - pip
    - pdm-backend >=1.0.5
  run:
    - packaging >=23.2
    - python
    - tomli >=2.0.1  # [py<311]
    - typing-extensions >=4.4.0  # [py<38]
  run_constrained:
    - platformdirs >=3.11.0
    - pydantic >=2.5.3

test:
  imports:
    - pytoolconfig
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/bagel897/pytoolconfig
  dev_url: https://github.com/bagel897/pytoolconfig
  summary: Python tool configuration
  description: |
    Python tool configuration.
  license: LGPL-3.0-or-later
  license_family: LGPL
  doc_url: https://github.com/bagel897/pytoolconfig/blob/main/README.md

extra:
  recipe-maintainers:
    - jan-janssen
